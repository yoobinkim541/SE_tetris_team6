name: Package

# 배포 패키지 (요구사항 p18, 명세 §16 CD-1): Windows용 app-image zip을 만들어 아티팩트로 올린다.
# main에 반영되거나 v* 태그를 붙이면 자동 실행, Actions 탭에서 수동 실행도 가능하다.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 태그 빌드에서 Release에 zip을 올리기 위해

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build package
        run: ./gradlew.bat packageApp --no-daemon

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: SE-Tetris-windows
          path: build/distributions/SE-Tetris-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/distributions/SE-Tetris-windows.zip --title "${{ github.ref_name }}" --generate-notes
