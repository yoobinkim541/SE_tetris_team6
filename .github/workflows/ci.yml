name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write   # PR 댓글 작성용

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # 테스트 실행 후 커버리지 기준선(build.gradle의 LINE 최소치)을 검사한다. 미달이면 이 단계가 실패한다
      - name: Test and coverage check
        run: ./gradlew test jacocoTestCoverageVerification --no-daemon

      # 실행 결과 요약(테스트 수·커버리지 %)을 summary.md로 만들어 Actions Summary와 PR 댓글에 쓴다
      - name: Summary (tests and coverage)
        if: always()
        run: |
          python3 - <<'EOF' > summary.md
          import glob, xml.etree.ElementTree as ET

          total = failed = skipped = 0
          rows = []
          for path in sorted(glob.glob('build/test-results/test/*.xml')):
              s = ET.parse(path).getroot()
              t, f, e, k = (int(s.get(a)) for a in ('tests', 'failures', 'errors', 'skipped'))
              total += t; failed += f + e; skipped += k
              rows.append((s.get('name').split('.')[-1], t, f + e, k))

          print('## Test results')
          print(f'**{total - failed - skipped} passed / {failed} failed / {skipped} skipped (total {total})**\n')
          print('| Test class | Tests | Failed | Skipped |')
          print('|---|---|---|---|')
          for name, t, f, k in rows:
              print(f'| {name} | {t} | {f} | {k} |')

          print('\n## Coverage (JaCoCo)')
          try:
              root = ET.parse('build/reports/jacoco/test/jacocoTestReport.xml').getroot()
              print('| Metric | Covered | Total | % |')
              print('|---|---|---|---|')
              for c in root.findall('counter'):
                  cov, miss = int(c.get('covered')), int(c.get('missed'))
                  print(f"| {c.get('type')} | {cov} | {cov + miss} | {100 * cov / (cov + miss):.1f}% |")
          except FileNotFoundError:
              print('Coverage report not found.')
          EOF
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # PR이면 같은 댓글을 갱신하고, 없으면 새로 만든다 (fork PR은 토큰이 읽기 전용이라 실패해도 CI는 막지 않는다)
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file summary.md --edit-last --create-if-none

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html

  # 배포 패키지: 더블클릭으로 실행되는 Tetris.exe(JRE 포함)를 만들어 아티팩트로 올린다
  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build jar
        run: .\gradlew.bat jar --no-daemon

      # 아이콘(src/main/resources/icons/tetris.ico)이 있으면 exe에 적용한다
      - name: Package exe
        shell: pwsh
        run: |
          $args = @('--type','app-image','--name','Tetris','--input','build/libs','--main-jar','tetris.jar','--main-class','tetris.Main','--dest','dist')
          if (Test-Path 'src/main/resources/icons/tetris.ico') { $args += @('--icon','src/main/resources/icons/tetris.ico') }
          else { Write-Host 'tetris.ico not found: packaging with the default icon' }
          jpackage @args
          Compress-Archive -Path dist/Tetris -DestinationPath Tetris-windows.zip

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Tetris-windows
          path: Tetris-windows.zip
