plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'tetris.Main'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

if (providers.gradleProperty('skipCoverage').isPresent()) {
    test.jacoco.enabled = false
    jacocoTestReport.enabled = false
}
