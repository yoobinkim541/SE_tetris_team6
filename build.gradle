plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'  // settings.json, scoreboard.json (PER-3: save 패키지에서만 사용)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'tetris.Main'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        xml.required = true   // CI가 커버리지 수치를 읽는 용도
        html.required = true
    }
}

if (providers.gradleProperty('skipCoverage').isPresent()) {
    test.jacoco.enabled = false
    jacocoTestReport.enabled = false
}
