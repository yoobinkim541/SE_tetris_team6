plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3' // 저장 계층(feature.save)에서만 사용 (PER-3)

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'tetris.Main'
}

test {
    // 저장·픽셀 인수 조건도 기본 CI에서 회귀 검증한다.
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    systemProperty 'java.awt.headless', 'true' // CI(화면 없음)와 같은 조건으로 UI 렌더링 테스트를 돌린다
}

sourceSets.test.java.srcDir 'audit/java'

tasks.register('guiAcceptance', Test) {
    group = 'verification'
    description = '실제 Windows 화면의 메뉴·세션·결과 저장 연결 검증'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'tetris.ui.ProductionWiringAuditTest' }
    systemProperty 'java.awt.headless', 'false'
    systemProperty 'audit.gui', 'true'
    systemProperty 'sun.java2d.uiScale', providers.gradleProperty('guiScale').getOrElse('1.0')
}

jacocoTestReport {
    reports {
        xml.required = true   // CI가 커버리지 수치를 읽는 용도
        html.required = true
    }
}

// 커버리지 게이트 (요구사항 p17, 명세 §16 CI-1): Line Coverage 70% 미만이면 check가 실패한다
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.70
            }
        }
    }
}
check.dependsOn jacocoTestCoverageVerification

if (providers.gradleProperty('skipCoverage').isPresent()) {
    test.jacoco.enabled = false
    jacocoTestReport.enabled = false
    jacocoTestCoverageVerification.enabled = false
}

// ── 배포 패키지 (요구사항 p18, 명세 §16 DEP-1·2) ─────────────────────
// gradlew packageApp → build/distributions/SE-Tetris-windows.zip
// 압축을 풀고 "SE Tetris\SE Tetris.exe"를 더블클릭하면 실행된다. JRE가 들어 있어 Java 설치·명령어 입력이 필요 없다.
// jpackage는 Gradle을 실행한 JDK(21 이상)의 것을 쓰고, 패키지는 그 OS용으로 만들어진다 (대상: Windows).
def appName = 'SE Tetris'
def appIcon = file('src/main/packaging/tetris.ico')
def packageInput = layout.buildDirectory.dir('jpackage/input')
def packageImage = layout.buildDirectory.dir('jpackage/image-v2')

jar {
    manifest {
        attributes 'Main-Class': 'tetris.Main'
    }
}

// Release용 JAR에는 런타임 의존성도 포함한다.
tasks.register('releaseJar', Jar) {
    group = 'distribution'
    archiveFileName = 'SE-Tetris.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': application.mainClass.get() }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}

// 실행 jar와 의존 라이브러리(Jackson)를 jpackage 입력 폴더 하나에 모은다
tasks.register('jpackageInput', Sync) {
    from jar
    from configurations.runtimeClasspath
    into packageInput
}

tasks.register('jpackageImage', Exec) {
    group = 'distribution'
    description = 'jpackage로 JRE를 포함한 app-image(아이콘 포함 실행 파일)를 만든다'
    dependsOn 'jpackageInput'
    inputs.dir(packageInput)
    inputs.file(appIcon)
    outputs.dir(packageImage)

    doFirst {
        def imageDir = packageImage.get().asFile
        def buildRoot = layout.buildDirectory.get().asFile.canonicalFile.toPath()
        def imagePath = imageDir.canonicalFile.toPath()
        if (!imagePath.startsWith(buildRoot) || imagePath == buildRoot) {
            throw new GradleException("패키지 정리 경로는 build 하위여야 합니다: ${imagePath}")
        }
        // jpackage가 Windows launcher에 설정한 ReadOnly 속성은 재패키징 전에 해제한다.
        if (System.getProperty('os.name').toLowerCase().contains('win')) {
            fileTree(imageDir).files.each { generatedFile ->
                java.nio.file.Files.setAttribute(generatedFile.toPath(), 'dos:readonly', false)
            }
        }
        if (imageDir.exists() && !imageDir.deleteDir()) {
            throw new GradleException("패키지 출력 폴더를 지울 수 없습니다. 실행 중인 패키지를 종료하고 다시 시도하세요: ${imageDir}")
        }
        def exe = System.getProperty('os.name').toLowerCase().contains('win') ? '.exe' : ''
        commandLine file("${System.getProperty('java.home')}/bin/jpackage${exe}"),
                '--type', 'app-image',
                '--name', appName,
                '--app-version', '1.0.0',
                '--vendor', 'SE Team6',
                '--input', packageInput.get().asFile,
                '--main-jar', jar.archiveFileName.get(),
                '--main-class', 'tetris.Main',
                '--icon', appIcon,
                '--dest', imageDir
        // --win-console을 쓰지 않아 실행 시 콘솔 창이 뜨지 않는다 (DEP-2)
    }
}

tasks.register('packageApp', Zip) {
    group = 'distribution'
    description = '배포용 zip (build/distributions/SE-Tetris-windows.zip)'
    dependsOn 'jpackageImage'
    from packageImage
    archiveFileName = 'SE-Tetris-windows.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
}
